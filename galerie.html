<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Galerie | Chacounette</title>
<meta name="description" content="Les photos de Chacounette, tigrée grise aux yeux verts.">
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0066cc;
    --accent-fill: #0071e3;
    --accent-fill-hover: #0077ed;
    --line: #d2d2d7;
    --tile: #f5f5f7;
    --tile-inv-bg: #1d1d1f;
    --tile-inv-text: #f5f5f7;
    --tile-inv-muted: #a1a1a6;
    --nav-bg: rgba(255, 255, 255, 0.8);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --bg-alt: #111113;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #2997ff;
      --accent-fill: #0071e3;
      --accent-fill-hover: #0077ed;
      --line: #38383a;
      --tile: #1c1c1e;
      --tile-inv-bg: #2c2c2e;
      --tile-inv-text: #f5f5f7;
      --tile-inv-muted: #a1a1a6;
      --nav-bg: rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --bg-alt: #111113;
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --accent: #2997ff;
    --accent-fill: #0071e3;
    --accent-fill-hover: #0077ed;
    --line: #38383a;
    --tile: #1c1c1e;
    --tile-inv-bg: #2c2c2e;
    --tile-inv-text: #f5f5f7;
    --tile-inv-muted: #a1a1a6;
    --nav-bg: rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--accent-fill); outline-offset: 3px; border-radius: 8px; }

  /* Navigation */
  .nav {
    position: sticky; top: 0; z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1024px; margin: 0 auto; padding: 0 22px;
    height: 48px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-size: 19px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }
  .brand:hover { text-decoration: none; }
  .nav ul { list-style: none; display: flex; gap: 28px; }
  .nav ul a { font-size: 12px; color: var(--text); opacity: 0.8; }
  .nav ul a:hover { opacity: 1; text-decoration: none; }
  .nav ul a[aria-current="page"] { opacity: 1; font-weight: 600; }
  

  /* Hero */
  .hero { text-align: center; padding: 72px 22px 0; overflow: hidden; }
  h1 {
    font-size: clamp(56px, 11vw, 112px);
    line-height: 1.02; font-weight: 600; letter-spacing: -0.045em;
  }
  .lead {
    margin: 14px auto 0; max-width: 560px;
    font-size: clamp(21px, 3vw, 28px); line-height: 1.2; font-weight: 400;
    letter-spacing: -0.015em; color: var(--muted);
  }
  .actions { margin-top: 28px; display: flex; gap: 22px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: 17px; letter-spacing: -0.01em;
    background: var(--accent-fill); color: #fff; border: 0; cursor: pointer;
    padding: 12px 24px; border-radius: 980px; transition: background 0.2s;
  }
  .btn:hover { background: var(--accent-fill-hover); }
  .btn:active { transform: scale(0.98); }
  .link { font-size: 17px; }
  .link::after { content: " ›"; }

  .stage { position: relative; margin: 44px auto 0; width: min(560px, calc(100vw - 44px)); }
  .portrait {
    display: block; width: 100%; height: auto; aspect-ratio: 1086 / 1100; object-fit: cover; object-position: 50% 0%;
    border-radius: 28px; cursor: pointer; background: var(--bg-alt);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .portrait.pressed { transform: scale(0.985); }
  .prr {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 980px;
    background: var(--nav-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    font-size: 19px; font-weight: 600; color: var(--text);
    opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap;
  }
  .prr.show { opacity: 1; }
  .count { min-height: 26px; margin-top: 16px; font-size: 14px; color: var(--muted); }

  /* Statement */
  .statement { padding: 120px 22px; background: var(--bg); }
  .statement p {
    max-width: 820px; margin: 0 auto; text-align: center;
    font-size: clamp(28px, 4.6vw, 48px); line-height: 1.12; font-weight: 600; letter-spacing: -0.03em;
  }
  .statement .soft { color: var(--muted); }

  /* Points forts */
  .features { background: var(--bg-alt); padding: 100px 22px; }
  .wrap { max-width: 1024px; margin: 0 auto; }
  h2 {
    font-size: clamp(32px, 5vw, 56px); line-height: 1.07; font-weight: 600; letter-spacing: -0.035em;
  }
  .features h2 { margin-bottom: 40px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .tile {
    background: var(--tile); border: 1px solid var(--line); border-radius: 28px;
    padding: 40px 36px; min-height: 340px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .tile.wide { grid-column: 1 / -1; min-height: 400px; }
  .tile.photo { position: relative; overflow: hidden; color: #fff; border-color: transparent; min-height: 480px; }
  .tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 25%; }
  .tile.photo::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 35%, rgba(0,0,0,0) 65%);
  }
  .tile.photo h3, .tile.photo p { position: relative; z-index: 2; }
  .tile.photo p { color: rgba(255,255,255,0.85); }
  .tile.inv { background: var(--tile-inv-bg); border-color: transparent; color: var(--tile-inv-text); }
  .tile h3 { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; max-width: 520px; }
  .tile p { margin-top: 12px; font-size: 19px; line-height: 1.32; color: var(--muted); max-width: 460px; }
  .tile.inv p { color: var(--tile-inv-muted); }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .tile, .tile.wide { min-height: 280px; padding: 32px 26px; }
    .tile.photo { min-height: 340px; }
  }

  /* Fiche technique */
  .specs { padding: 100px 22px; }
  .specs h2 { margin-bottom: 36px; }
  dl { border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: minmax(120px, 1fr) 2fr; gap: 24px;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  dt { font-size: 14px; color: var(--muted); padding-top: 3px; }
  dd { font-size: 19px; line-height: 1.3; letter-spacing: -0.015em; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 2px; } }

  /* Closing */
  .closing { background: var(--bg-alt); text-align: center; padding: 120px 22px; }
  .closing p { margin: 16px auto 0; max-width: 480px; font-size: 21px; line-height: 1.3; color: var(--muted); }

  footer { padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .portrait { transition: none; }
    .btn:active { transform: none; }
  }

  /* Lien vers la galerie */
  .more { margin-top: 36px; text-align: center; }

  /* Page galerie */
  .page-head { text-align: center; padding: 72px 22px 44px; }
  .page-head .lead { max-width: 520px; }
  .hint { margin-top: 18px; font-size: 14px; color: var(--muted); }
  .gallery { max-width: 1024px; margin: 0 auto; padding: 8px 22px 100px; columns: 3; column-gap: 16px; }
  @media (max-width: 860px) { .gallery { columns: 2; } }
  @media (max-width: 520px) { .gallery { columns: 1; } }
  .shot {
    display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; overflow: hidden;
    background: var(--bg-alt); border-radius: 22px; cursor: zoom-in; break-inside: avoid;
  }
  .shot img { display: block; width: 100%; height: auto; }
  .shot img.crop { aspect-ratio: 4 / 3; object-fit: cover; }

  /* Visionneuse */
  .lightbox {
    border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none;
    background: transparent; color: #f5f5f7;
  }
  .lightbox::backdrop { background: rgba(0, 0, 0, 0.9); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .lb-inner { position: fixed; inset: 0; }
  /* Couche de la photo : c'est elle (et elle seule) qui zoome et se déplace */
  .lb-stage {
    position: absolute; inset: 0; box-sizing: border-box; overflow: hidden; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    padding: calc(64px + env(safe-area-inset-top)) 72px calc(90px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  .lb-stage img {
    max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 16px;
    will-change: transform; -webkit-user-drag: none; -webkit-touch-callout: none;
  }
  .lb-stage img.anim { transition: transform 0.28s ease; }
  /* Interface : reste en place quel que soit le zoom */
  .lb-caption {
    position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 2;
    width: fit-content; max-width: calc(100% - 32px); margin: 0 auto; padding: 6px 16px; border-radius: 980px;
    background: rgba(0, 0, 0, 0.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 17px; text-align: center; color: #f5f5f7; pointer-events: none;
  }
  .lb-btn {
    position: absolute; z-index: 3; width: 44px; height: 44px; border: 0; border-radius: 50%; cursor: pointer;
    background: rgba(0, 0, 0, 0.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: #fff; font: inherit; font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-btn:hover { background: rgba(0, 0, 0, 0.7); }
  .lb-close { top: calc(16px + env(safe-area-inset-top)); right: 16px; }
  .lb-prev { left: 16px; top: 50%; margin-top: -22px; }
  .lb-next { right: 16px; top: 50%; margin-top: -22px; }
  @media (max-width: 600px) {
    .lb-stage { padding: calc(64px + env(safe-area-inset-top)) 12px calc(126px + env(safe-area-inset-bottom)); }
    .lb-caption { bottom: calc(78px + env(safe-area-inset-bottom)); }
    .lb-prev, .lb-next { top: auto; bottom: calc(22px + env(safe-area-inset-bottom)); margin-top: 0; }
    .lb-prev { left: calc(50% - 56px); }
    .lb-next { right: calc(50% - 56px); }
  }
  @media (prefers-reduced-motion: reduce) { .lb-stage img.anim { transition: none; } }


  /* Menu mobile plein écran */
  .menu-btn { display: none; width: 44px; height: 44px; margin-right: -13px; padding: 0; border: 0; background: none; color: var(--text); cursor: pointer; align-items: center; justify-content: center; }
  .menu-btn .bars { position: relative; display: block; width: 18px; height: 12px; }
  .menu-btn .bars span { position: absolute; left: 0; width: 100%; height: 1.5px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, top 0.3s ease, opacity 0.2s ease; }
  .menu-btn .bars span:nth-child(1) { top: 0; }
  .menu-btn .bars span:nth-child(2) { top: 5.25px; }
  .menu-btn .bars span:nth-child(3) { top: 10.5px; }
  .menu-btn[aria-expanded="true"] .bars span:nth-child(1) { top: 5.25px; transform: rotate(45deg); }
  .menu-btn[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] .bars span:nth-child(3) { top: 5.25px; transform: rotate(-45deg); }
  .menu-panel { display: none; }
  @media (max-width: 640px) {
    .nav nav { display: none; }
    .menu-btn { display: flex; }
    .menu-panel {
      display: block; position: fixed; left: 0; right: 0; top: calc(49px + env(safe-area-inset-top)); bottom: 0; z-index: 9; overflow-y: auto;
      background: var(--bg); padding: 24px 22px calc(48px + env(safe-area-inset-bottom));
      visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0.25s;
    }
    .menu-panel.open { visibility: visible; opacity: 1; }
    .menu-panel a { display: block; padding: 11px 0; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.025em; color: var(--text); }
    .menu-panel a:hover { text-decoration: none; opacity: 0.7; }
    .menu-panel a[aria-current="page"] { color: var(--muted); }
  }
  @media (prefers-reduced-motion: reduce) { .menu-btn .bars span, .menu-panel { transition: none; } }
</style>
</head>

<script>
  (function () {
    var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));
    var dlg = document.getElementById('lightbox');
    var stage = document.getElementById('lb-stage');
    var img = document.getElementById('lb-img');
    var cap = document.getElementById('lb-cap');
    var i = 0;

    // ---- Zoom et déplacement de la PHOTO uniquement (croix, flèches et légende ne bougent pas) ----
    var MAX = 5;
    var scale = 1, tx = 0, ty = 0;
    var pointers = new Map();
    var g = null;          // geste en cours
    var lastTap = 0;

    function apply() { img.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')'; }
    function resetZoom() {
      scale = 1; tx = 0; ty = 0; g = null; pointers.clear();
      img.classList.remove('anim');
      img.style.transform = '';
    }
    // Centre de la photo (sans zoom), par rapport à la couche
    function base() { return { x: img.offsetLeft + img.offsetWidth / 2, y: img.offsetTop + img.offsetHeight / 2 }; }
    function rel(x, y) { var o = stage.getBoundingClientRect(); return { x: x - o.left, y: y - o.top }; }
    function clampScale(v) { return Math.max(1, Math.min(MAX, v)); }
    // Empêche de sortir la photo de l'écran
    function limit() {
      var b = base();
      var w = img.offsetWidth * scale, h = img.offsetHeight * scale;
      var sw = stage.clientWidth, sh = stage.clientHeight;
      tx = w <= sw ? 0 : Math.min(w / 2 - b.x, Math.max(sw - w / 2 - b.x, tx));
      ty = h <= sh ? 0 : Math.min(h / 2 - b.y, Math.max(sh - h / 2 - b.y, ty));
    }
    // Zoome en gardant sous les doigts le point de la photo qui était touché
    function place(m0, m1, s2, s0, tx0, ty0) {
      var b = base();
      var ux = (m0.x - b.x - tx0) / s0, uy = (m0.y - b.y - ty0) / s0;
      scale = s2;
      tx = m1.x - ux * s2 - b.x;
      ty = m1.y - uy * s2 - b.y;
      if (scale < 1.02) { scale = 1; tx = 0; ty = 0; }
      limit();
      apply();
    }
    function twoPoints() {
      var a = Array.from(pointers.values());
      var p = rel(a[0].x, a[0].y), q = rel(a[1].x, a[1].y);
      return { d: Math.hypot(p.x - q.x, p.y - q.y) || 1, m: { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 } };
    }
    function toggleZoom(x, y) {
      img.classList.add('anim');
      var m = rel(x, y);
      if (scale > 1.01) { scale = 1; tx = 0; ty = 0; apply(); }
      else { place(m, m, 2.5, 1, 0, 0); }
      setTimeout(function () { img.classList.remove('anim'); }, 320);
    }

    stage.addEventListener('pointerdown', function (e) {
      try { stage.setPointerCapture(e.pointerId); } catch (err) {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      img.classList.remove('anim');
      if (pointers.size === 1) {
        g = { moved: false, multi: false, sx: e.clientX, sy: e.clientY, tx0: tx, ty0: ty, onStage: e.target === stage, pinch: null };
      } else if (pointers.size === 2 && g) {
        var tp = twoPoints();
        g.multi = true;
        g.pinch = { d: tp.d, m: tp.m, s: scale, tx: tx, ty: ty };
      }
    });

    stage.addEventListener('pointermove', function (e) {
      if (!g || !pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && g.pinch) {
        var tp = twoPoints();
        place(g.pinch.m, tp.m, clampScale(g.pinch.s * tp.d / g.pinch.d), g.pinch.s, g.pinch.tx, g.pinch.ty);
      } else if (pointers.size === 1 && !g.multi) {
        var dx = e.clientX - g.sx, dy = e.clientY - g.sy;
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) g.moved = true;
        if (scale > 1.01) { tx = g.tx0 + dx; ty = g.ty0 + dy; limit(); apply(); }
      }
    });

    function endPointer(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      if (pointers.size > 0) { if (g && pointers.size < 2) g.pinch = null; return; }
      var gesture = g;
      g = null;
      if (!gesture || e.type === 'pointercancel') return;
      if (scale < 1.02) { scale = 1; tx = 0; ty = 0; apply(); }
      if (gesture.multi) return;                                   // fin d'un pincement : rien d'autre
      if (!gesture.moved) {                                        // simple appui
        var now = Date.now();
        if (now - lastTap < 300) { lastTap = 0; toggleZoom(e.clientX, e.clientY); return; }
        lastTap = now;
        if (gesture.onStage && scale === 1) dlg.close();           // appui sur le fond : fermer
        return;
      }
      var dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
      if (scale === 1 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(dx < 0 ? i + 1 : i - 1);
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);

    // Souris / pavé tactile d'ordinateur
    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      var m = rel(e.clientX, e.clientY);
      place(m, m, clampScale(scale * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.002))), scale, tx, ty);
    }, { passive: false });

    // Empêche Safari de zoomer la page pendant un pincement sur la photo
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
      stage.addEventListener(name, function (e) { e.preventDefault(); });
    });
    window.addEventListener('resize', function () { if (dlg.open) { limit(); apply(); } });

    // ---- Navigation ----
    function show(n) {
      resetZoom();
      i = (n + shots.length) % shots.length;
      var t = shots[i].querySelector('img');
      img.src = t.currentSrc || t.src;
      img.alt = t.alt;
      cap.textContent = shots[i].getAttribute('data-caption');
    }
    function open(n) {
      show(n);
      document.documentElement.style.overflow = 'hidden';
      dlg.showModal();
    }

    shots.forEach(function (s, n) { s.addEventListener('click', function () { open(n); }); });
    dlg.querySelector('.lb-close').addEventListener('click', function () { dlg.close(); });
    dlg.querySelector('.lb-prev').addEventListener('click', function () { show(i - 1); });
    dlg.querySelector('.lb-next').addEventListener('click', function () { show(i + 1); });
    dlg.addEventListener('close', function () { resetZoom(); document.documentElement.style.overflow = ''; });
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') show(i - 1);
      if (e.key === 'ArrowRight') show(i + 1);
    });
  })();
</script>

<script>
  (function () {
    var btn = document.querySelector('.menu-btn');
    var panel = document.getElementById('menu');
    var mq = window.matchMedia('(max-width: 640px)');
    function set(open) {
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
      panel.classList.toggle('open', open);
      document.documentElement.style.overflow = open ? 'hidden' : '';
    }
    btn.addEventListener('click', function () { set(btn.getAttribute('aria-expanded') !== 'true'); });
    panel.addEventListener('click', function (e) { if (e.target.closest('a')) set(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel.classList.contains('open')) { set(false); btn.focus(); }
    });
    var onChange = function (e) { if (!e.matches) set(false); };
    if (mq.addEventListener) mq.addEventListener('change', onChange); else mq.addListener(onChange);
  })();
</script>
</body>
</html>
