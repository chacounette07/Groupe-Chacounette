<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chacounette | Modifications en cours</title>
<style>
  :root { --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f5f5f7; --muted: #a1a1a6; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100svh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 22px;
  }
  h1 { font-size: clamp(48px, 10vw, 96px); line-height: 1.02; font-weight: 600; letter-spacing: -0.045em; }
  .lead { margin-top: 14px; font-size: clamp(21px, 3vw, 28px); line-height: 1.2; color: var(--muted); letter-spacing: -0.015em; }
  p.note { margin-top: 10px; max-width: 460px; font-size: 17px; line-height: 1.47; color: var(--muted); }
  img {
    display: block; width: min(520px, 100%); height: auto; aspect-ratio: 4 / 3; object-fit: cover;
    margin-top: 40px; border-radius: 28px;
  }
</style>
</head>
<body>
  <h1>Chacounette</h1>
  <p class="lead">Modifications en cours.</p>
  <p class="note">Chacounette fait la sieste pendant les travaux. Le site revient très vite.</p>
  <img src="IMG_0358.jpeg" alt="Chacounette les yeux fermés, blottie dans une couette bleu-vert" width="1800" height="1350">
</body>
</html>
